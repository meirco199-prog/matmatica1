<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת לימוד חשבון</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #222; direction: rtl; }

/* LOGIN */
#login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1a73e8,#0d47a1); padding:20px; }
.login-title { color:white; font-size:2.2rem; font-weight:800; margin-bottom:6px; }
.login-sub { color:rgba(255,255,255,.8); font-size:1rem; margin-bottom:36px; }
.user-cards { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-bottom:28px; }
.user-card { background:white; border-radius:20px; padding:24px 28px; text-align:center; cursor:pointer; box-shadow:0 8px 32px #0003; border:3px solid transparent; transition:all .2s; min-width:150px; }
.user-card:hover { transform:translateY(-4px); box-shadow:0 14px 40px #0004; }
.user-card.selected { border-color:#fbbc04; transform:translateY(-4px); }
.user-avatar { width:72px; height:72px; border-radius:50%; object-fit:cover; margin:0 auto 10px; display:block; }
.user-avatar-emoji { font-size:3rem; line-height:72px; width:72px; height:72px; display:block; text-align:center; margin:0 auto 10px; }
.user-card .uname { font-size:1.2rem; font-weight:700; color:#222; }
.user-card .urole { font-size:0.8rem; color:#888; margin-top:3px; }
.pin-area { background:white; border-radius:16px; padding:22px 28px; text-align:center; box-shadow:0 4px 20px #0002; min-width:280px; }
.pin-area h3 { font-size:1.05rem; color:#333; margin-bottom:14px; }
.pin-dots { display:flex; gap:10px; justify-content:center; margin-bottom:18px; }
.pin-dot { width:15px; height:15px; border-radius:50%; background:#e0e0e0; transition:background .12s; }
.pin-dot.filled { background:#1a73e8; }
.pin-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; max-width:230px; margin:0 auto 12px; }
.pin-key { padding:13px; border:none; border-radius:10px; background:#f0f4f8; font-size:1.15rem; font-weight:700; cursor:pointer; transition:background .1s; color:#222; }
.pin-key:hover { background:#e8f0fe; }
.pin-key:active { background:#1a73e8; color:white; }
.pin-key.del { background:#fce8e6; color:#ea4335; }
.pin-key.del:hover { background:#ea4335; color:white; }
.pin-error { color:#ea4335; font-size:.86rem; margin-top:6px; min-height:18px; }
.pin-hint { font-size:.76rem; color:#bbb; margin-top:6px; }
.change-pin-link { font-size:.78rem; color:#1a73e8; cursor:pointer; margin-top:8px; text-decoration:underline; }

/* APP */
#app-shell { display:none; }
header { background:linear-gradient(135deg,#1a73e8,#0d47a1); color:white; padding:11px 20px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px #0003; }
header h1 { font-size:1.3rem; }
.header-right { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.header-user { background:rgba(255,255,255,.2); border-radius:20px; padding:4px 13px; font-size:.87rem; display:flex; align-items:center; gap:5px; }
.header-avatar { width:26px; height:26px; border-radius:50%; object-fit:cover; }
.sync-badge { font-size:.75rem; padding:3px 10px; border-radius:12px; font-weight:600; }
.sync-badge.synced  { background:#34a853; color:white; }
.sync-badge.syncing { background:#fbbc04; color:#222; }
.sync-badge.offline { background:rgba(255,255,255,.2); color:rgba(255,255,255,.8); }
.sync-badge.error   { background:#ea4335; color:white; }
.header-btn { background:rgba(255,255,255,.15); border:none; color:white; padding:5px 12px; border-radius:8px; cursor:pointer; font-size:.82rem; }
.header-btn:hover { background:rgba(255,255,255,.3); }

.main-layout { display:flex; min-height:calc(100vh - 54px); }
.sidebar { width:225px; background:#fff; border-left:2px solid #e0e0e0; padding:10px 0; flex-shrink:0; overflow-y:auto; }
.sidebar-title { font-size:.7rem; font-weight:700; color:#bbb; text-transform:uppercase; letter-spacing:.05em; padding:8px 15px 3px; }
.sidebar-btn { display:block; width:100%; text-align:right; padding:9px 15px; background:none; border:none; cursor:pointer; font-size:.9rem; color:#333; border-right:3px solid transparent; transition:all .12s; }
.sidebar-btn:hover { background:#e8f0fe; color:#1a73e8; }
.sidebar-btn.active { background:#e8f0fe; color:#1a73e8; border-right-color:#1a73e8; font-weight:600; }
.content { flex:1; padding:20px; overflow-y:auto; }

.btn { padding:8px 16px; border:none; border-radius:8px; cursor:pointer; font-size:.87rem; font-weight:600; transition:all .12s; }
.btn-primary { background:#1a73e8; color:white; } .btn-primary:hover { background:#1558b0; }
.btn-success { background:#34a853; color:white; } .btn-success:hover { background:#2d8f46; }
.btn-warning { background:#fbbc04; color:#222; } .btn-warning:hover { background:#e0a800; }
.btn-danger  { background:#ea4335; color:white; } .btn-danger:hover  { background:#c5221f; }
.btn-outline { background:white; border:2px solid #1a73e8; color:#1a73e8; } .btn-outline:hover { background:#e8f0fe; }
.btn-sm { padding:5px 11px; font-size:.8rem; }

.grade-bar { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
.grade-btn { padding:6px 13px; border:2px solid #1a73e8; border-radius:20px; background:white; color:#1a73e8; cursor:pointer; font-size:.86rem; font-weight:600; transition:all .12s; }
.grade-btn.active,.grade-btn:hover { background:#1a73e8; color:white; }

.exercise-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; flex-wrap:wrap; gap:9px; }
.exercise-title { font-size:1.15rem; font-weight:700; color:#1a73e8; }
.exercise-controls { display:flex; gap:7px; flex-wrap:wrap; }
.stats-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.stat-chip { background:white; border-radius:10px; padding:5px 11px; font-size:.81rem; box-shadow:0 1px 4px #0001; border:1px solid #e0e0e0; }
.stat-chip b { color:#1a73e8; }
.stat-chip.correct { border-color:#34a853; } .stat-chip.correct b { color:#34a853; }
.stat-chip.wrong   { border-color:#ea4335; } .stat-chip.wrong b   { color:#ea4335; }
.progress-wrap { background:#e0e0e0; border-radius:10px; height:8px; margin-bottom:13px; overflow:hidden; }
.progress-fill { height:100%; border-radius:10px; background:linear-gradient(90deg,#34a853,#1a73e8); transition:width .3s; }
.exercise-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(295px,1fr)); gap:10px; }
.exercise-card { background:white; border-radius:12px; padding:14px; box-shadow:0 1px 5px #0001; border:2px solid #e8eaed; transition:all .15s; position:relative; direction:ltr; }
.exercise-card.answered-correct { border-color:#34a853; background:#f0faf4; }
.exercise-card.answered-wrong   { border-color:#ea4335; background:#fff5f5; }
.exercise-num { position:absolute; top:8px; right:11px; font-size:.7rem; color:#ccc; font-weight:600; }
.exercise-q { font-size:1.2rem; font-weight:700; margin-bottom:10px; text-align:center; color:#222; line-height:1.6; direction:ltr; unicode-bidi:bidi-override; }
.exercise-q .fraction { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 3px; }
.exercise-q .fraction .num { border-bottom:2px solid #222; padding-bottom:1px; line-height:1.2; }
.exercise-q .fraction .den { line-height:1.2; }
.answer-row { display:flex; gap:7px; align-items:center; }
.answer-input { flex:1; padding:7px 10px; border:2px solid #e0e0e0; border-radius:8px; font-size:1rem; text-align:center; outline:none; transition:border .12s; }
.answer-input:focus { border-color:#1a73e8; }
.answer-input.correct { border-color:#34a853; background:#f0faf4; }
.answer-input.wrong   { border-color:#ea4335; background:#fff5f5; }
.check-btn { padding:7px 12px; background:#1a73e8; color:white; border:none; border-radius:8px; cursor:pointer; font-size:.82rem; font-weight:600; white-space:nowrap; }
.check-btn:hover { background:#1558b0; }
.result-icon { font-size:1.3rem; min-width:26px; text-align:center; }
.correct-answer { font-size:.78rem; color:#ea4335; margin-top:5px; font-weight:600; }
.mark-done-btn { position:absolute; top:8px; left:11px; background:none; border:none; cursor:pointer; font-size:1rem; opacity:.35; transition:opacity .12s; }
.mark-done-btn:hover,.mark-done-btn.active { opacity:1; }
.input-hint { font-size:.71rem; color:#bbb; margin-top:3px; text-align:center; direction:rtl; }
.fix-btn { padding:3px 10px; background:#fff3cd; border:1px solid #fbbc04; border-radius:7px; cursor:pointer; font-size:.78rem; font-weight:700; color:#856404; transition:all .12s; }
.fix-btn:hover { background:#fbbc04; color:#222; }
.readonly-badge { position:absolute; top:8px; right:40px; background:#fbbc04; color:#222; font-size:.66rem; font-weight:700; padding:2px 7px; border-radius:7px; }

.mult-table { overflow-x:auto; margin-top:12px; }
.mult-table table { border-collapse:collapse; }
.mult-table td,.mult-table th { width:43px; height:43px; text-align:center; font-size:.9rem; border:1px solid #e0e0e0; }
.mult-table th { background:#1a73e8; color:white; font-weight:700; }
.mult-table td { background:white; cursor:pointer; transition:background .08s; }
.mult-table td:hover { background:#e8f0fe; }
.mult-table td.highlight { background:#bbdefb; }
.mult-table td.header-col { background:#1a73e8; color:white; font-weight:700; cursor:default; }

.modal-overlay { display:none; position:fixed; inset:0; background:#0007; z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:white; border-radius:16px; padding:26px; max-width:500px; width:93%; box-shadow:0 8px 32px #0003; max-height:90vh; overflow-y:auto; }
.modal h2 { font-size:1.25rem; margin-bottom:14px; text-align:center; }
.score-big { font-size:2.8rem; font-weight:800; color:#1a73e8; text-align:center; margin:10px 0; }
.score-detail { font-size:.93rem; color:#555; text-align:center; margin-bottom:18px; }
.modal-btns { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }

.welcome { text-align:center; padding:26px 14px; }
.welcome h2 { font-size:1.75rem; color:#1a73e8; margin-bottom:7px; }
.welcome p { color:#666; font-size:.95rem; margin-bottom:22px; }
.topic-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:12px; max-width:820px; margin:0 auto; }
.topic-card { background:white; border-radius:13px; padding:18px 12px; text-align:center; cursor:pointer; box-shadow:0 2px 8px #0001; border:2px solid #e8eaed; transition:all .18s; }
.topic-card:hover { border-color:#1a73e8; transform:translateY(-2px); }
.topic-card .topic-icon { font-size:2rem; margin-bottom:7px; }
.topic-card .topic-name { font-weight:700; font-size:.94rem; }
.topic-card .topic-desc { font-size:.75rem; color:#999; margin-top:3px; }

.session-list { display:flex; flex-direction:column; gap:10px; }
.session-item { background:white; border-radius:12px; padding:14px 16px; border:2px solid #e8eaed; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:all .15s; }
.session-item:hover { border-color:#1a73e8; box-shadow:0 4px 14px #1a73e815; }
.session-topic { font-weight:700; font-size:.95rem; }
.session-meta { font-size:.77rem; color:#aaa; margin-top:3px; }
.session-score { font-size:1.2rem; font-weight:800; color:#1a73e8; min-width:60px; text-align:center; }
.session-score.great { color:#34a853; }
.session-score.bad   { color:#ea4335; }
.no-history { text-align:center; padding:40px; color:#bbb; font-size:1rem; }

/* Settings */
.settings-section { background:white; border-radius:14px; padding:20px; margin-bottom:14px; box-shadow:0 1px 6px #0001; }
.settings-section h3 { font-size:1rem; font-weight:700; margin-bottom:13px; color:#333; }
.field-label { font-size:.83rem; color:#666; margin-bottom:5px; font-weight:600; }
.field-input { width:100%; padding:9px 13px; border:2px solid #e0e0e0; border-radius:9px; font-size:.9rem; outline:none; margin-bottom:10px; }
.field-input:focus { border-color:#1a73e8; }
.field-textarea { width:100%; padding:9px 13px; border:2px solid #e0e0e0; border-radius:9px; font-size:.8rem; outline:none; margin-bottom:10px; height:110px; font-family:monospace; resize:vertical; direction:ltr; }
.field-textarea:focus { border-color:#1a73e8; }
.emoji-grid { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
.emoji-opt { font-size:1.9rem; cursor:pointer; padding:5px; border-radius:8px; border:2px solid transparent; transition:all .12s; }
.emoji-opt:hover { background:#e8f0fe; }
.emoji-opt.selected { border-color:#1a73e8; background:#e8f0fe; }
.upload-label { display:inline-block; padding:8px 16px; background:#f0f4f8; border:2px dashed #bbb; border-radius:9px; cursor:pointer; font-size:.85rem; color:#666; transition:all .12s; }
.upload-label:hover { border-color:#1a73e8; color:#1a73e8; }
.current-avatar-preview { width:76px; height:76px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 12px; font-size:2.8rem; line-height:76px; text-align:center; background:#f0f4f8; border:3px solid #e0e0e0; }
.new-pin-row { display:flex; gap:8px; align-items:center; }
.new-pin-input { flex:1; padding:9px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:1rem; text-align:center; outline:none; letter-spacing:.3em; }
.new-pin-input:focus { border-color:#1a73e8; }
.sync-step { display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; }
.sync-step-num { background:#1a73e8; color:white; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; flex-shrink:0; margin-top:2px; }
.sync-step-text { font-size:.87rem; color:#444; line-height:1.5; }
.sync-step-text a { color:#1a73e8; }
.family-code-display { background:#f0f4f8; border-radius:10px; padding:14px; text-align:center; margin:12px 0; }
.family-code-big { font-size:1.6rem; font-weight:800; letter-spacing:.2em; color:#1a73e8; font-family:monospace; }
.family-code-hint { font-size:.78rem; color:#999; margin-top:4px; }
.sync-status-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; flex-wrap:wrap; gap:8px; }
.info-box { background:#e8f0fe; border-radius:10px; padding:12px 14px; font-size:.83rem; color:#1558b0; margin-bottom:12px; line-height:1.6; }
.info-box.warning { background:#fff8e1; color:#b45309; }

/* Dashboard */
.dashboard-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:14px; }
.child-card { background:white; border-radius:15px; padding:20px; box-shadow:0 2px 10px #0001; border:2px solid #e8eaed; }
.child-card h3 { font-size:1.15rem; margin-bottom:13px; display:flex; align-items:center; gap:8px; }
.child-stat { display:flex; justify-content:space-between; margin-bottom:8px; font-size:.88rem; }
.child-stat b { color:#1a73e8; }
.topic-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:.79rem; }
.topic-row .tname { min-width:88px; }
.topic-row .tbar-wrap { flex:1; height:7px; background:#e0e0e0; border-radius:4px; overflow:hidden; }
.topic-row .tbar { height:100%; border-radius:4px; background:#34a853; }
.topic-row .tpct { min-width:32px; text-align:left; color:#666; }
.reset-child-btn { margin-top:13px; padding:6px 12px; background:#fce8e6; color:#ea4335; border:none; border-radius:8px; cursor:pointer; font-size:.79rem; font-weight:600; }
.reset-child-btn:hover { background:#ea4335; color:white; }

/* MOBILE BOTTOM NAV */
.mobile-nav { display:none; position:fixed; bottom:0; left:0; right:0; background:white; border-top:2px solid #e0e0e0; z-index:500; padding:6px 0 env(safe-area-inset-bottom,6px); box-shadow:0 -2px 12px #0002; }
.mobile-nav-inner { display:flex; justify-content:space-around; }
.mobile-nav-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px; border:none; background:none; cursor:pointer; font-size:.62rem; color:#888; min-width:52px; }
.mobile-nav-btn .mnicon { font-size:1.4rem; }
.mobile-nav-btn.active { color:#1a73e8; }
.mobile-topic-drawer { display:none; position:fixed; bottom:60px; left:0; right:0; background:white; border-top:2px solid #e0e0e0; z-index:499; padding:10px; box-shadow:0 -4px 20px #0003; max-height:55vh; overflow-y:auto; }
.mobile-topic-drawer.open { display:block; }
.mobile-topic-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.mobile-topic-item { padding:10px 6px; border-radius:10px; border:2px solid #e8eaed; text-align:center; cursor:pointer; font-size:.78rem; font-weight:600; background:white; }
.mobile-topic-item:active { background:#e8f0fe; border-color:#1a73e8; }
.mobile-topic-item .mti { font-size:1.4rem; display:block; margin-bottom:3px; }
.mobile-grade-row { display:flex; gap:6px; overflow-x:auto; padding:8px 0; margin-bottom:8px; }
.mobile-grade-btn { padding:5px 12px; border:2px solid #1a73e8; border-radius:16px; background:white; color:#1a73e8; font-size:.8rem; font-weight:700; white-space:nowrap; cursor:pointer; flex-shrink:0; }
.mobile-grade-btn.active { background:#1a73e8; color:white; }

@media(max-width:600px){
  .sidebar { display:none; }
  .exercise-grid { grid-template-columns:1fr; }
  .dashboard-grid { grid-template-columns:1fr; }
  .mobile-nav { display:block; }
  .content { padding-bottom:80px; }
  header h1 { font-size:1.1rem; }
  .header-right { gap:5px; }
  .sync-badge { font-size:.68rem; padding:2px 7px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-title">📐 לימוד חשבון</div>
  <div class="login-sub">בחר את הפרופיל שלך</div>
  <div class="user-cards" id="user-cards"></div>
  <div class="pin-area" id="pin-area" style="display:none;">
    <h3 id="pin-title">הכנס קוד</h3>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="pin-keypad">
      <button class="pin-key" onclick="pinPress('1')">1</button><button class="pin-key" onclick="pinPress('2')">2</button><button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button><button class="pin-key" onclick="pinPress('5')">5</button><button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button><button class="pin-key" onclick="pinPress('8')">8</button><button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key" style="font-size:.83rem;" onclick="pinClear()">ביטול</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key del" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div class="pin-hint" id="pin-hint"></div>
    <div class="change-pin-link" id="change-pin-link" onclick="openChangePinModal()" style="display:none;">שנה קוד</div>
  </div>
</div>

<!-- APP -->
<div id="app-shell">
  <header>
    <h1>📐 לימוד חשבון</h1>
    <div class="header-right">
      <span class="sync-badge offline" id="sync-badge">☁️ ללא סנכרון</span>
      <button class="header-btn" onclick="manualSync()" title="סנכרן עכשיו">🔄</button>
      <div class="header-user" id="header-user"></div>
      <button class="header-btn" onclick="logout()">יציאה</button>
    </div>
  </header>
  <div class="main-layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- Mobile bottom nav -->
<div class="mobile-nav" id="mobile-nav" style="display:none;">
  <div class="mobile-nav-inner">
    <button class="mobile-nav-btn" onclick="mobileNav('home')"><span class="mnicon">🏠</span>בית</button>
    <button class="mobile-nav-btn" onclick="mobileNav('topics')"><span class="mnicon">📝</span>נושאים</button>
    <button class="mobile-nav-btn" onclick="mobileNav('history')"><span class="mnicon">📂</span>היסטוריה</button>
    <button class="mobile-nav-btn" onclick="mobileNav('settings')"><span class="mnicon">⚙️</span>הגדרות</button>
    <button class="mobile-nav-btn" id="mobile-dash-btn" onclick="mobileNav('dash')" style="display:none;"><span class="mnicon">📊</span>מעקב</button>
  </div>
</div>

<!-- Mobile topics drawer -->
<div class="mobile-topic-drawer" id="mobile-topic-drawer">
  <div class="mobile-grade-row" id="mobile-grade-row"></div>
  <div class="mobile-topic-grid">
    <div class="mobile-topic-item" onclick="startTopic('addition');closeMobileDrawer()"><span class="mti">➕</span>חיבור</div>
    <div class="mobile-topic-item" onclick="startTopic('subtraction');closeMobileDrawer()"><span class="mti">➖</span>חיסור</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const DEFAULT_PINS    = { adar:'1234', agam:'5678', ariel:'9999', parent:'0000' };
const DEFAULT_AVATARS = { adar:'🧒', agam:'👧', ariel:'👦', parent:'👨‍👩‍👧‍👦' };
const USER_NAMES      = { adar:'אדר', agam:'אגם', ariel:'אריאל', parent:'הורה' };
const USER_ROLES      = { adar:'תלמיד', agam:'תלמידה', ariel:'תלמיד', parent:'ניהול ומעקב' };
const EMOJIS = ['🧒','👦','👧','🧑','👩','👨','🧔','👱','🐱','🐶','🦁','🐯','🦊','🐸','🐧','🦋','⭐','🌟','🚀','🎮','🎨','🎵','🏆','🌈','🦄','🐉','🎃','🍕','🌺','🎯'];
const TOPIC_NAMES = {'addition':'חיבור','subtraction':'חיסור','multiplication':'כפל','division':'חילוק','long-division':'חילוק ארוך','fractions':'שברים','frac-simplify':'צמצום שברים','decimals':'עשרוניים','mixed':'מעורב'};

// ============================================================
// STATE
// ============================================================
let currentUser=null, selectedUser=null, pinBuffer='';
let currentTopic='mixed', currentGrade=3;
let exercises=[], answered={}, isReadOnly=false;
let currentSessionId=null; // שמירה אוטומטית לפי session ID
let pendingAvatar=null;
let fbDb=null, syncActive=false, familyCode='';
let parentDashActive=false;
let isResetting=false; // flag: מונע מה-listener לשחזר נתונים בזמן איפוס

// ============================================================
// LOCAL STORAGE HELPERS
// ============================================================
const LS = {
  get:(k,def='')=>{ try{return JSON.parse(localStorage.getItem(k))??def;}catch{return def;} },
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
  rm:(k)=>localStorage.removeItem(k)
};

function getPin(uid)     { return localStorage.getItem('pin_'+uid)    || DEFAULT_PINS[uid]; }
function getAvatar(uid)  { return localStorage.getItem('avatar_'+uid) || DEFAULT_AVATARS[uid]; }
function setPin(uid,p)   { localStorage.setItem('pin_'+uid,p); }
function setAvatar(uid,a){ localStorage.setItem('avatar_'+uid,a); }
function getProgress(uid){ return LS.get('progress_'+uid,{}); }
function getSessions(uid){ return LS.get('sessions_'+uid,[]); }
function saveSessions(uid,arr){ LS.set('sessions_'+uid, arr.slice(-40)); }
async function doReset(uid){
  if(!confirm(`לאפס את כל הנתונים של ${USER_NAMES[uid]}?`)) return;
  await resetProgress(uid);
  renderParentDash();
  alert(`✅ הנתונים של ${USER_NAMES[uid]} אופסו בכל המכשירים`);
}

async function resetProgress(uid){
  isResetting = true;
  LS.rm('progress_'+uid);
  LS.rm('sessions_'+uid);
  if(syncActive && fbDb){
    try {
      // set במקום remove — מבטיח שה-listener יתפעל בכל מכשיר
      await fbDb.ref(`families/${familyCode}/${uid}`).update({
        progress: null,
        sessions: null,
        resetAt: Date.now() // גורם ל-listener לירות גם אם שאר הנתונים זהים
      });
    } catch(e){ console.error('reset error', e); }
  }
  isResetting = false;
}
function saveProgressEntry(uid,topic,grade,total,correct){
  const p=getProgress(uid);
  if(!p[topic])p[topic]={};
  if(!p[topic][grade])p[topic][grade]={sessions:0,total:0,correct:0};
  p[topic][grade].sessions++;p[topic][grade].total+=total;p[topic][grade].correct+=correct;
  LS.set('progress_'+uid,p);
}

// ============================================================
// FIREBASE SYNC
// ============================================================
function getFbConfig(){ return LS.get('fbConfig',null); }
function getFamilyCode(){ return localStorage.getItem('familyCode')||''; }

function initFirebase(config, code) {
  try {
    if (!config.databaseURL) throw new Error('databaseURL חסר');
    try { firebase.app('math-app').delete(); } catch(e){}
    const app = firebase.initializeApp(config, 'math-app');
    fbDb = firebase.database(app);
    syncActive = true;
    familyCode = code;
    localStorage.setItem('familyCode', code);
    LS.set('fbConfig', config);
    updateSyncBadge('syncing','🔄 מתחבר...');
    // Connection status
    fbDb.ref('.info/connected').on('value', snap => {
      if(snap.val()) updateSyncBadge('synced','☁️ מסונכרן');
      else updateSyncBadge('error','⚠️ אין חיבור');
    });
    // Real-time listeners: כל שינוי בענן → עדכן מקומי + רענן דאשבורד הורה
    ['adar','agam','ariel','parent'].forEach(uid => {
      fbDb.ref(`families/${code}/${uid}`).on('value', snap => {
        if(isResetting) return; // בזמן איפוס — התעלם
        if(!snap.exists()) {
          LS.rm('progress_'+uid); LS.rm('sessions_'+uid);
          if(currentUser === 'parent' && parentDashActive) renderParentDash();
          return;
        }
        const d = snap.val();
        // תמיד מסנכרן כולל null — כך איפוס מתפשט לכל מכשיר
        LS.set('progress_'+uid, d.progress ?? {});
        LS.set('sessions_'+uid, d.sessions ?? []);
        if(d.avatar) setAvatar(uid, d.avatar);
        if(d.grade)  localStorage.setItem('grade_'+uid, d.grade);
        if(d.pin)    setPin(uid, d.pin);
        if(currentUser === 'parent' && parentDashActive) renderParentDash();
      });
    });
    return true;
  } catch(e) {
    console.error(e);
    syncActive=false; fbDb=null;
    updateSyncBadge('error','❌ שגיאת הגדרות');
    return false;
  }
}

function updateSyncBadge(cls, text) {
  const b=document.getElementById('sync-badge');
  if(!b) return;
  b.className='sync-badge '+cls;
  b.textContent=text;
}

async function pushUserData(uid) {
  if(!syncActive||!fbDb) return;
  updateSyncBadge('syncing','🔄 שומר...');
  try {
    const data = {
      progress: getProgress(uid),
      sessions: getSessions(uid),
      avatar: getAvatar(uid),
      grade: localStorage.getItem('grade_'+uid)||'3',
      pin: getPin(uid),
      lastSync: Date.now()
    };
    await fbDb.ref(`families/${familyCode}/${uid}`).set(data);
    updateSyncBadge('synced','☁️ מסונכרן');
  } catch(e) {
    updateSyncBadge('error','⚠️ שגיאת שמירה');
  }
}

async function pullUserData(uid) {
  if(!syncActive||!fbDb) return false;
  try {
    const snap = await fbDb.ref(`families/${familyCode}/${uid}`).get();
    if(snap.exists()){
      const d=snap.val();
      if(d.progress) LS.set('progress_'+uid, d.progress);
      if(d.sessions) LS.set('sessions_'+uid, d.sessions);
      if(d.avatar)   setAvatar(uid, d.avatar);
      if(d.grade)    localStorage.setItem('grade_'+uid, d.grade);
      if(d.pin)      setPin(uid, d.pin);
    }
    return true;
  } catch(e){ return false; }
}

async function manualSync() {
  if(!syncActive){ showSection('settings'); return; }
  updateSyncBadge('syncing','🔄 מסנכרן...');
  for(const uid of ['adar','agam','ariel','parent']){
    await pushUserData(uid);
    await pullUserData(uid);
  }
  updateSyncBadge('synced','☁️ מסונכרן');
  renderLoginCards();
}

async function syncOnLogin(uid) {
  if(!syncActive||!fbDb) return;
  updateSyncBadge('syncing','🔄 טוען נתונים...');
  // הורה — מושך נתונים של כולם
  if(uid === 'parent') {
    await pullUserData('adar');
    await pullUserData('agam');
    await pullUserData('ariel');
    await pullUserData('parent');
  } else {
    await pullUserData(uid);
  }
  updateSyncBadge('synced','☁️ מסונכרן');
}

// ============================================================
// MATH HELPERS
// ============================================================
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function lcm(a,b){return(a*b)/gcd(a,b);}
function rnd(mn,mx){return Math.floor(Math.random()*(mx-mn+1))+mn;}
function simplify(n,d){const g=gcd(Math.abs(n),Math.abs(d));return[n/g,d/g];}
function gradeHeb(g){return['','א׳','ב׳','ג׳','ד׳','ה׳','ו׳'][g]||g;}
function fmtFraction(n,d){if(d===1)return String(n);return`<span class="fraction"><span class="num">${n}</span><span class="den">${d}</span></span>`;}
function parseFractionInput(val){
  val=val.trim().replace(/\s/g,'');
  if(/^-?\d+\/\d+$/.test(val)){const[n,d]=val.split('/').map(Number);return{n,d,valid:d!==0};}
  if(/^-?\d+$/.test(val))return{n:parseInt(val),d:1,valid:true};
  if(/^-?\d+[.,]\d+$/.test(val)){const f=parseFloat(val.replace(',','.'));const dec=(val.replace(',','.').split('.')[1]||'').length;return{n:Math.round(f*Math.pow(10,dec)),d:Math.pow(10,dec),valid:true};}
  return{valid:false};
}
function fractionsEqual(n1,d1,n2,d2){return n1*d2===n2*d1;}

// ============================================================
// GENERATORS
// ============================================================
const generators={
  addition:(g)=>{
    if(g<=2){const a=rnd(1,20),b=rnd(1,20);return{q:`${a} + ${b} = ?`,ans:a+b,type:'int'};}
    if(g<=3){const a=rnd(10,99),b=rnd(10,99);return{q:`${a} + ${b} = ?`,ans:a+b,type:'int'};}
    if(g<=4){const a=rnd(100,999),b=rnd(100,999);return{q:`${a} + ${b} = ?`,ans:a+b,type:'int'};}
    const a=rnd(1000,9999),b=rnd(1000,9999);return{q:`${a} + ${b} = ?`,ans:a+b,type:'int'};
  },
  subtraction:(g)=>{
    if(g<=2){const b=rnd(1,15),a=rnd(b,20);return{q:`${a} - ${b} = ?`,ans:a-b,type:'int'};}
    if(g<=3){const b=rnd(10,90),a=rnd(b+1,199);return{q:`${a} - ${b} = ?`,ans:a-b,type:'int'};}
    const b=rnd(100,900),a=rnd(b+1,1999);return{q:`${a} - ${b} = ?`,ans:a-b,type:'int'};
  },
  multiplication:(g)=>{
    if(g<=3){const a=rnd(1,10),b=rnd(1,10);return{q:`${a} × ${b} = ?`,ans:a*b,type:'int'};}
    if(g<=4){const a=rnd(2,12),b=rnd(10,99);return{q:`${a} × ${b} = ?`,ans:a*b,type:'int'};}
    const a=rnd(10,99),b=rnd(10,99);return{q:`${a} × ${b} = ?`,ans:a*b,type:'int'};
  },
  division:(g)=>{
    if(g<=3){const b=rnd(1,10),a=rnd(1,10);return{q:`${b*a} ÷ ${b} = ?`,ans:a,type:'int'};}
    if(g<=4){const b=rnd(2,12),a=rnd(2,20);return{q:`${b*a} ÷ ${b} = ?`,ans:a,type:'int'};}
    const b=rnd(2,12),a=rnd(10,50);return{q:`${b*a} ÷ ${b} = ?`,ans:a,type:'int'};
  },
  'long-division':(g)=>{
    const div=rnd(2,g<=3?6:9),q=rnd(10,g<=4?50:99),r=g<=2?0:rnd(0,div-1);
    const dividend=div*q+r;
    return{q:`${dividend} ÷ ${div} = ?`,ans:r>0?`${q} שארית ${r}`:`${q}`,type:'long-div',extra:{dividend,divisor:div,quotient:q,remainder:r}};
  },
  fractions:(g)=>{
    const ops=g<=3?['add','sub']:g<=4?['add','sub','mul']:['add','sub','mul','div'];
    const op=ops[rnd(0,ops.length-1)];
    let d1=rnd(2,g<=3?6:10),n1=rnd(1,d1-1),d2=g<=3?d1:rnd(2,8),n2=rnd(1,d2-1);
    let qHtml,ansN,ansD;
    if(op==='add'){const l=lcm(d1,d2);ansN=n1*(l/d1)+n2*(l/d2);ansD=l;qHtml=`${fmtFraction(n1,d1)} + ${fmtFraction(n2,d2)} = ?`;}
    else if(op==='sub'){const l=lcm(d1,d2);let r1=n1*(l/d1),r2=n2*(l/d2);if(r1<r2){[n1,d1,n2,d2]=[n2,d2,n1,d1];[r1,r2]=[r2,r1];}ansN=r1-r2;ansD=l;qHtml=`${fmtFraction(n1,d1)} - ${fmtFraction(n2,d2)} = ?`;}
    else if(op==='mul'){ansN=n1*n2;ansD=d1*d2;qHtml=`${fmtFraction(n1,d1)} × ${fmtFraction(n2,d2)} = ?`;}
    else{ansN=n1*d2;ansD=d1*n2;qHtml=`${fmtFraction(n1,d1)} ÷ ${fmtFraction(n2,d2)} = ?`;}
    const[sn,sd]=simplify(ansN,ansD);
    return{q:qHtml,ans:`${sn}/${sd}`,ansN:sn,ansD:sd,type:'fraction',html:true};
  },
  'frac-simplify':(g)=>{
    const d=rnd(2,g<=4?6:12),k=rnd(2,g<=4?4:8),n=rnd(1,d-1);
    const[sn,sd]=simplify(n*k,d*k);
    return{q:`${fmtFraction(n*k,d*k)} — צמצם`,ans:`${sn}/${sd}`,ansN:sn,ansD:sd,type:'fraction',html:true};
  },
  decimals:(g)=>{
    const t=['add','sub','small-mul','small-mul'][rnd(0,3)];
    if(t==='small-mul'){const bases=[0.001,0.01,0.1],mults=[10,100,1000,45,7,25,50,200];const base=bases[rnd(0,bases.length-1)],mult=mults[rnd(0,mults.length-1)];return{q:`${base} × ${mult} = ?`,ans:String(parseFloat((base*mult).toPrecision(10))),type:'decimal'};}
    const dec=rnd(1,2),factor=Math.pow(10,dec);
    if(t==='add'){const a=rnd(1,99)/factor,b=rnd(1,99)/factor;return{q:`${a.toFixed(dec)} + ${b.toFixed(dec)} = ?`,ans:String(parseFloat((a+b).toFixed(dec+1))),type:'decimal'};}
    const b=rnd(1,40)/factor,a=rnd(50,99)/factor;return{q:`${a.toFixed(dec)} - ${b.toFixed(dec)} = ?`,ans:String(parseFloat((a-b).toFixed(dec+1))),type:'decimal'};
  },
  mixed:(g)=>{
    const pool=g<=2?['addition','subtraction','multiplication']:g<=3?['addition','subtraction','multiplication','division']:g<=4?['addition','subtraction','multiplication','division','long-division','fractions']:['multiplication','division','long-division','fractions','frac-simplify','decimals'];
    return generators[pool[rnd(0,pool.length-1)]](g);
  }
};

function generateExercises(count){
  isReadOnly=false; count=count||(currentGrade<=3?20:30);
  exercises=[]; answered={};
  currentSessionId = Date.now(); // ID ייחודי לסט הזה
  for(let i=0;i<count;i++) exercises.push(generators[currentTopic](currentGrade));
  showSection('exercises');
  autoSaveSession(); // שמירה ראשונית
}

function renderExercises(){
  const total=exercises.length,done=Object.keys(answered).length;
  const correct=Object.values(answered).filter(a=>a.correct).length;
  const wrong=Object.values(answered).filter(a=>!a.correct).length;
  let html=`<div class="exercise-header">
    <div class="exercise-title">${isReadOnly?'📂':'📝'} ${TOPIC_NAMES[currentTopic]||currentTopic} — כיתה ${gradeHeb(currentGrade)}</div>
    <div class="exercise-controls">
      ${!isReadOnly?`<button class="btn btn-success" onclick="checkAll()">✅ בדוק הכל</button><button class="btn btn-primary" onclick="generateExercises()">🔄 סט חדש</button><button class="btn btn-warning" onclick="showResults()">📊 תוצאות</button>`:''}
      <button class="btn btn-outline" onclick="showSection('history')">📂 היסטוריה</button>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-chip">סה"כ: <b>${total}</b></div>
    <div class="stat-chip">ענית: <b>${done}</b></div>
    <div class="stat-chip correct">נכון: <b>${correct}</b></div>
    <div class="stat-chip wrong">שגוי: <b>${wrong}</b></div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" style="width:${total?done/total*100:0}%"></div></div>
  <div class="exercise-grid">`;

  exercises.forEach((ex,i)=>{
    const ans=answered[i];
    let cc='exercise-card';
    if(ans) cc+=ans.correct?' answered-correct':' answered-wrong';
    let result='',inputClass='';
    if(ans){
      if(ans.correct){
        result=`<div class="result-icon">✅</div>`;
        inputClass='correct';
      } else {
        result=`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="result-icon">❌</div>
          <div class="correct-answer">תשובה: ${ex.ans}</div>
          ${!isReadOnly?`<button class="fix-btn" onclick="fixAnswer(${i})">✏️ תקן</button>`:''}
        </div>`;
        inputClass='wrong';
      }
    }
    const hint=ex.type==='fraction'?'<div class="input-hint">פורמט: 3/4</div>':ex.type==='long-div'?'<div class="input-hint">לדוגמה: 12 שארית 3</div>':'';
    html+=`<div class="${cc}" id="card-${i}">
      <span class="exercise-num">#${i+1}</span>
      ${isReadOnly?`<span class="readonly-badge">צפייה</span>`:`<button class="mark-done-btn ${ans?.marked?'active':''}" onclick="toggleMark(${i})">⭐</button>`}
      <div class="exercise-q">${ex.q}</div>
      <div class="answer-row">
        <input type="text" class="answer-input ${inputClass}" id="input-${i}" value="${ans?.userAnswer||''}" placeholder="תשובה..." ${(ans||isReadOnly)?'disabled':''} onkeydown="if(event.key==='Enter')checkOne(${i})">
        ${(!ans&&!isReadOnly)?`<button class="check-btn" onclick="checkOne(${i})">בדוק</button>`:''}
        ${result}
      </div>${hint}</div>`;
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

function evalAnswer(ex,val){
  val=val.trim(); if(!val)return null;
  if(ex.type==='int') return parseInt(val)===ex.ans;
  if(ex.type==='fraction'){const p=parseFractionInput(val);return p.valid?fractionsEqual(p.n,p.d,ex.ansN,ex.ansD):false;}
  if(ex.type==='decimal') return Math.abs(parseFloat(val.replace(',','.'))-parseFloat(ex.ans))<1e-9;
  if(ex.type==='long-div'){
    const e=ex.extra,v=val.trim().toLowerCase();
    if(e.remainder===0)return parseInt(val)===e.quotient;
    return[new RegExp(`^${e.quotient}\\s*שארית\\s*${e.remainder}$`),new RegExp(`^${e.quotient}\\s*r\\s*${e.remainder}$`)].some(p=>p.test(v));
  }
  return null;
}

function checkOne(i){
  const inp=document.getElementById('input-'+i);
  const val=inp?inp.value:''; if(!val.trim())return;
  const correct=evalAnswer(exercises[i],val);
  if(correct===null)return;
  answered[i]={correct,userAnswer:val.trim(),marked:answered[i]?.marked||false};
  autoSaveSession(); // שמירה אוטומטית
  renderExercises();
  setTimeout(()=>{const el=document.getElementById('card-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},40);
}

// KEY FIX: collect all values first, evaluate all, render ONCE
function checkAll(){
  const vals={};
  exercises.forEach((_,i)=>{ if(!answered[i]){const inp=document.getElementById('input-'+i);if(inp&&inp.value.trim())vals[i]=inp.value.trim();} });
  Object.entries(vals).forEach(([i,val])=>{ const c=evalAnswer(exercises[+i],val); if(c!==null)answered[+i]={correct:c,userAnswer:val,marked:answered[+i]?.marked||false}; });
  autoSaveSession(); // שמירה אוטומטית
  renderExercises();
}

function fixAnswer(i){
  // מחק תשובה שגויה ואפשר לתקן
  const marked = answered[i]?.marked || false;
  delete answered[i];
  renderExercises();
  // פוקוס על השדה
  setTimeout(()=>{
    const inp = document.getElementById('input-'+i);
    if(inp){ inp.value=''; inp.focus(); }
  }, 50);
}

function autoSaveSession(){
  if(!currentUser || isReadOnly || !currentSessionId) return;
  const correct = Object.values(answered).filter(a=>a.correct).length;
  const total = exercises.length;
  const pct = total ? Math.round(correct/total*100) : 0;
  const session = {
    id: currentSessionId,
    uid: currentUser,
    topic: currentTopic,
    grade: currentGrade,
    date: new Date().toLocaleDateString('he-IL'),
    time: new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),
    exercises: exercises.map(e=>({...e})),
    answered: {...answered},
    score: {correct, total, pct},
    inProgress: Object.keys(answered).length < total // עדיין בתהליך
  };
  // עדכן סשן קיים או הוסף חדש
  const sessions = getSessions(currentUser).filter(s => s.id !== currentSessionId);
  sessions.push(session);
  saveSessions(currentUser, sessions);
  if(syncActive && fbDb) pushUserData(currentUser).catch(()=>{});
}

function toggleMark(i){
  if(!answered[i])answered[i]={correct:false,userAnswer:'',marked:false};
  answered[i].marked=!answered[i].marked;
  const b=document.querySelector(`#card-${i} .mark-done-btn`);
  if(b)b.classList.toggle('active',answered[i].marked);
}

async function showResults(){
  const total=exercises.length,arr=Object.values(answered);
  const correct=arr.filter(a=>a.correct).length;
  document.getElementById('modal-score').textContent=`${correct}/${total}`;
  const pct=total?Math.round(correct/total*100):0;
  const emoji=pct>=90?'🏆 מצוין!':pct>=70?'👍 כל הכבוד!':pct>=50?'📚 טוב, המשך!':'💪 תנסה שוב!';
  document.getElementById('modal-detail').innerHTML=`<b>${pct}%</b> — ${emoji}<br>נכון: ${correct} · שגוי: ${arr.filter(a=>!a.correct).length} · לא ענית: ${total-arr.length}`;
  document.getElementById('results-modal').classList.add('open');
  // Save session (mark as complete)
  saveProgressEntry(currentUser,currentTopic,currentGrade,total,correct);
  const session={id:currentSessionId||Date.now(),uid:currentUser,topic:currentTopic,grade:currentGrade,date:new Date().toLocaleDateString('he-IL'),time:new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),exercises:exercises.map(e=>({...e})),answered:{...answered},score:{correct,total,pct},inProgress:false};
  const sessions=getSessions(currentUser).filter(s=>s.id!==session.id);
  sessions.push(session); saveSessions(currentUser,sessions);
  await pushUserData(currentUser);
}
function closeModal(){ document.getElementById('results-modal').classList.remove('open'); }

function renderHistory(){
  const sessions=getSessions(currentUser).slice().reverse();
  let html=`<div class="exercise-header"><div class="exercise-title">📂 הסטים שעשיתי</div></div>`;
  if(!sessions.length){html+=`<div class="no-history">עדיין אין סטים שמורים.</div>`;}
  else{
    html+=`<div class="session-list">`;
    sessions.forEach(s=>{
      const cls=s.score.pct>=80?'great':s.score.pct<50?'bad':'';
      const hasExercises = s.exercises && s.exercises.length > 0;
      const badge=s.inProgress
        ? `<div style="font-size:.62rem;background:#fff3cd;color:#856404;border-radius:6px;padding:2px 6px;margin-top:3px;font-weight:700;">🔄 המשך</div>`
        : `<div style="font-size:.62rem;font-weight:400;">${s.score.pct}%</div>`;
      const noDataWarning = !hasExercises
        ? `<div style="font-size:.62rem;color:#bbb;margin-top:2px;">⚠️ סט ישן</div>` : '';
      html+=`<div class="session-item" onclick="loadSession(${s.id})" style="${!hasExercises?'opacity:.55;cursor:not-allowed;':''}">
        <div class="session-info">
          <div class="session-topic">${TOPIC_NAMES[s.topic]||s.topic} — כיתה ${gradeHeb(s.grade)}</div>
          <div class="session-meta">${s.date} · ${s.time||''} · ${s.score.total} תרגילים</div>
          ${noDataWarning}
        </div>
        <div class="session-score ${cls}">${s.score.correct}/${s.score.total}${badge}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('content').innerHTML=html;
}

function loadSession(id){
  // תמיכה בהשוואת ID גם כמספר וגם כמחרוזת (Firebase יכול להחזיר בפורמטים שונים)
  const s=getSessions(currentUser).find(x=>x.id==id);
  if(!s){ alert('הסט לא נמצא.'); return; }
  if(!s.exercises || !s.exercises.length){
    alert('⚠️ הסט הישן הזה לא כולל נתוני תרגילים ולא ניתן לפתוח אותו.\nסטים חדשים נשמרים אוטומטית עם כל התרגילים.');
    return;
  }
  exercises = s.exercises;
  answered  = s.answered || {};
  currentTopic = s.topic;
  currentGrade = s.grade;
  currentSessionId = s.id; // שמור ID כדי שניתן יהיה להמשיך
  // סשן "בתהליך" → המשך עריכה; סשן שלם → צפייה בלבד
  isReadOnly = s.inProgress ? false : true;
  showSection('exercises');
}

async function saveAndInitSync(){

  const msg=document.getElementById('sync-msg');
  if(!code){msg.style.color='#ea4335';msg.textContent='נא להזין קוד משפחה';return;}
  let cfg;
  try { cfg=JSON.parse(rawCfg); } catch(e){ msg.style.color='#ea4335';msg.textContent='JSON לא תקין — בדוק שהדבקת נכון';return; }
  if(!cfg.databaseURL){msg.style.color='#ea4335';msg.textContent='חסר databaseURL בקונפיג';return;}
  msg.style.color='#888';msg.textContent='מחבר...';
  const ok=initFirebase(cfg,code);
  if(ok){
    msg.style.color='#34a853';msg.textContent='✅ מחובר! מסנכרן נתונים...';
    await manualSync();
    msg.textContent='✅ מחובר ומסונכרן!';
  } else {
    msg.style.color='#ea4335';msg.textContent='שגיאה — בדוק את הקונפיג ואת ה-databaseURL';
  }
}

function disableSync(){
  syncActive=false; fbDb=null;
  LS.rm('fbConfig'); localStorage.removeItem('familyCode');
  updateSyncBadge('offline','☁️ ללא סנכרון');
  renderSettings();
}

// ============================================================
// MULT TABLE
// ============================================================
function renderMultTable(){
  const max=currentGrade<=2?5:currentGrade<=3?10:12;
  let html=`<div class="exercise-header"><div class="exercise-title">✖️ לוח הכפל (עד ${max})</div><div class="exercise-controls"><button class="btn btn-primary" onclick="startTopic('multiplication')">🎯 תרגל!</button></div></div>`;
  html+=`<div class="mult-table"><table><tr><th>×</th>`;
  for(let i=1;i<=max;i++)html+=`<th>${i}</th>`;
  html+='</tr>';
  for(let i=1;i<=max;i++){
    html+=`<tr><td class="header-col">${i}</td>`;
    for(let j=1;j<=max;j++)html+=`<td onclick="hlCell(this,${i},${j})" id="mc-${i}-${j}">${i*j}</td>`;
    html+='</tr>';
  }
  html+=`</table></div><div style="margin-top:7px;font-size:.79rem;color:#aaa;">לחץ על תא להדגשה</div>`;
  document.getElementById('content').innerHTML=html;
}
function hlCell(el,r,c){
  document.querySelectorAll('.mult-table td.highlight').forEach(t=>t.classList.remove('highlight'));
  for(let j=1;j<=12;j++){const t=document.getElementById(`mc-${r}-${j}`);if(t)t.classList.add('highlight');}
  for(let i=1;i<=12;i++){const t=document.getElementById(`mc-${i}-${c}`);if(t)t.classList.add('highlight');}
  el.style.background='#ffd600';
}

// ============================================================
// WELCOME
// ============================================================
function renderWelcome(){
  const topics=[{key:'addition',icon:'➕',name:'חיבור',desc:'חיבור מספרים'},{key:'subtraction',icon:'➖',name:'חיסור',desc:'חיסור מספרים'},{key:'multiplication',icon:'✖️',name:'כפל',desc:'לוח הכפל ועוד'},{key:'division',icon:'➗',name:'חילוק',desc:'חילוק מספרים'},{key:'long-division',icon:'📏',name:'חילוק ארוך',desc:'עם שאריות'},{key:'fractions',icon:'½',name:'שברים',desc:'חיבור/חיסור/כפל/חילוק'},{key:'frac-simplify',icon:'🔢',name:'צמצום שברים',desc:'מציאת הצורה הפשוטה'},{key:'decimals',icon:'📍',name:'עשרוניים',desc:'0.001×100 ועוד'},{key:'mixed',icon:'🎲',name:'מעורב',desc:'הכל ביחד!'}];
  const av=getAvatar(currentUser);
  const avEl=av&&av.startsWith('data:')?`<img src="${av}" style="width:62px;height:62px;border-radius:50%;object-fit:cover;margin-bottom:10px;">`:
    `<div style="font-size:2.8rem;margin-bottom:6px;">${av||DEFAULT_AVATARS[currentUser]}</div>`;
  document.getElementById('content').innerHTML=`<div class="welcome">
    ${avEl}
    <h2>שלום ${USER_NAMES[currentUser]}!</h2>
    <p>בחר נושא כדי להתחיל לתרגל</p>
    <div class="grade-bar" style="justify-content:center;margin-bottom:22px;">
      ${[2,3,4,5,6].map(g=>`<button class="grade-btn ${g===currentGrade?'active':''}" onclick="setGrade(${g})">כיתה ${gradeHeb(g)}</button>`).join('')}
    </div>
    <div class="topic-cards">${topics.map(t=>`<div class="topic-card" onclick="startTopic('${t.key}')"><div class="topic-icon">${t.icon}</div><div class="topic-name">${t.name}</div><div class="topic-desc">${t.desc}</div></div>`).join('')}</div>
  </div>`;
}

function startTopic(t){currentTopic=t;generateExercises();}
function setGrade(g){currentGrade=g;localStorage.setItem('grade_'+currentUser,g);renderWelcome();}

// ============================================================
// SECTIONS
// ============================================================
function showSection(sec){
  parentDashActive = false; // reset כשיוצאים מהדאשבורד
  if(sec==='welcome')renderWelcome();
  else if(sec==='mult-table')renderMultTable();
  else if(sec==='exercises')renderExercises();
  else if(sec==='history')renderHistory();
  else if(sec==='settings')renderSettings();
}

// ============================================================
// PARENT DASHBOARD
// ============================================================
function renderParentDash(){ parentDashActive=true;
  function childCard(uid){
    const u=USER_NAMES[uid],p=getProgress(uid);
    const av=getAvatar(uid);
    const avEl=av&&av.startsWith('data:')?`<img src="${av}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">`:av||DEFAULT_AVATARS[uid];
    const topics=Object.keys(p);
    if(!topics.length)return`<div class="child-card"><h3>${avEl} ${u}</h3><div style="color:#ccc;text-align:center;padding:18px;font-size:.9rem;">אין נתונים עדיין</div><button class="reset-child-btn" onclick="doReset('${uid}')">🗑️ אפס</button></div>`;
    let tot=0,cor=0,sess=0;
    topics.forEach(t=>Object.values(p[t]).forEach(g=>{sess+=g.sessions;tot+=g.total;cor+=g.correct;}));
    const pct=tot?Math.round(cor/tot*100):0;
    let rows='';
    topics.forEach(t=>{let tt=0,tc=0;Object.values(p[t]).forEach(g=>{tt+=g.total;tc+=g.correct;});const pp=tt?Math.round(tc/tt*100):0;rows+=`<div class="topic-row"><span class="tname">${TOPIC_NAMES[t]||t}</span><div class="tbar-wrap"><div class="tbar" style="width:${pp}%"></div></div><span class="tpct">${pp}%</span></div>`;});
    return`<div class="child-card"><h3>${avEl} ${u}</h3>
      <div class="child-stat"><span>מפגשים:</span><b>${sess}</b></div>
      <div class="child-stat"><span>תרגילים:</span><b>${tot}</b></div>
      <div class="child-stat"><span>נכון:</span><b>${cor} (${pct}%)</b></div>
      <div class="progress-wrap" style="margin:10px 0 8px;"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${rows}
      <button class="reset-child-btn" onclick="doReset('${uid}')">🗑️ אפס נתונים</button>
    </div>`;
  }
  document.getElementById('content').innerHTML=`
    <div style="font-size:1.1rem;font-weight:700;color:#1a73e8;margin-bottom:14px;">📊 לוח בקרה הורה</div>
    <div class="dashboard-grid">${['adar','agam','ariel'].map(childCard).join('')}</div>
    <div style="margin-top:14px;text-align:center;"><button class="btn btn-outline" onclick="manualSync()">🔄 רענן נתונים</button></div>
    <div style="margin-top:12px;font-size:.76rem;color:#ccc;text-align:center;">נתונים מסונכרנים מהענן כאשר הסנכרון מופעל</div>
  `;
}

// ============================================================
// MOBILE NAV
// ============================================================
function showMobileNav(isParent) {
  const nav = document.getElementById('mobile-nav');
  if(nav) nav.style.display = 'block';
  const dashBtn = document.getElementById('mobile-dash-btn');
  if(dashBtn) dashBtn.style.display = isParent ? 'flex' : 'none';
}
function hideMobileNav() {
  const nav = document.getElementById('mobile-nav');
  if(nav) nav.style.display = 'none';
}
function mobileNav(sec) {
  if(sec === 'topics') {
    const drawer = document.getElementById('mobile-topic-drawer');
    if(drawer.classList.contains('open')) { closeMobileDrawer(); return; }
    // build grade row
    const gr = document.getElementById('mobile-grade-row');
    gr.innerHTML = [2,3,4,5,6].map(g =>
      `<button class="mobile-grade-btn ${g===currentGrade?'active':''}" onclick="setGrade(${g});buildMobileGradeRow()">${gradeHeb(g)}</button>`
    ).join('');
    drawer.classList.add('open');
  } else {
    closeMobileDrawer();
    if(sec==='home') renderWelcome();
    else if(sec==='history') showSection('history');
    else if(sec==='settings') showSection('settings');
    else if(sec==='dash') renderParentDash();
  }
}
function closeMobileDrawer() {
  document.getElementById('mobile-topic-drawer').classList.remove('open');
}
function buildMobileGradeRow() {
  const gr = document.getElementById('mobile-grade-row');
  if(!gr) return;
  gr.innerHTML = [2,3,4,5,6].map(g =>
    `<button class="mobile-grade-btn ${g===currentGrade?'active':''}" onclick="setGrade(${g});buildMobileGradeRow()">${gradeHeb(g)}</button>`
  ).join('');
}
// Close drawer when tapping outside
document.addEventListener('click', e => {
  const drawer = document.getElementById('mobile-topic-drawer');
  const nav = document.getElementById('mobile-nav');
  if(drawer && drawer.classList.contains('open') && !drawer.contains(e.target) && !nav.contains(e.target)) {
    closeMobileDrawer();
  }
});
